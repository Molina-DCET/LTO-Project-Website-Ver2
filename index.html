<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTO Cabuyao District Office - Queuing System</title>
    <meta name="description" content="Land Transportation Office Cabuyao District Office Queuing System Homepage">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="header-left">
            <img src="img/logo.png" alt="LTO Logo" class="header-logo">
            <div class="header-title-container">
                <span class="header-title">LAND TRANSPORTATION OFFICE</span>
                <span class="header-subtitle">CABUYAO DISTRICT OFFICE</span>
            </div>
        </div>
        <div class="header-right">
            <div class="time-container">
                <span class="date-text" id="date-display">August 02, 2026</span>
                <span class="time-text" id="time-display">14:34:33</span>
            </div>
            <a href="login.html" class="admin-btn" id="admin-button">ADMIN</a>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        <!-- Faint Watermark Logo in Background -->
        <img src="img/logo.png" alt="LTO Logo Watermark" class="hero-watermark">
        
        <div class="hero-content">
            <h1 class="hero-title">QUEUING SYSTEM</h1>
            
            <!-- Link to viewQueuing.html which is standard for the project -->
            <a href="viewQueuing.html" class="view-queuing-btn" id="view-queuing-button">
                <img src="img/people logo.png" alt="People Icon" class="people-icon">
                <span class="btn-label">VIEW QUEUING</span>
            </a>
        </div>
    </main>

    <!-- Live Philippine Standard Time Script -->
    <script>
        function updateClock() {
            try {
                const now = new Date();
                
                // Format date in Manila/Philippine timezone (UTC+8)
                const dateOptions = {
                    timeZone: 'Asia/Manila',
                    month: 'long',
                    day: '2-digit',
                    year: 'numeric'
                };
                // Example format: "August 02, 2026"
                const dateStr = now.toLocaleDateString('en-US', dateOptions);
                
                // Format time in Manila/Philippine timezone (military / 24-hour style)
                const timeOptions = {
                    timeZone: 'Asia/Manila',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                };
                // Example format: "14:34"
                let timeStr = now.toLocaleTimeString('en-US', timeOptions);
                
                // Safeguard 24-hour style if locale defaults otherwise
                // (some localizations might return a space and AM/PM even with hour12: false)
                timeStr = timeStr.replace(/\s*[a-zA-Z]+/g, '');
                
                // Update DOM elements
                document.getElementById('date-display').textContent = dateStr;
                document.getElementById('time-display').textContent = timeStr;
            } catch (e) {
                console.error("Error updating Philippine Time: ", e);
            }
        }

        // Run immediately on page load
        updateClock();
        // Update every 1 second (1000 milliseconds)
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
